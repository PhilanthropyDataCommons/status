storage:
  type: sqlite
  path: /data/data.db

alerting:
  zulip:
    bot-email: pdc-status-bot@chat.opentechstrategies.com
    bot-api-key: ${{ secrets.BOT_API_KEY }}
    domain: chat.opentechstrategies.com
#    channel-id: 123456 

endpoints:
  - name: pdc
    url: "https://philanthropydatacommons.org"
    interval: 600s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: zulip
        description: "Healthcheck failed for philanthropydatacommons.org"
        send-on-resolved: true    

  - name: pdcapi
    url: "https://api.philanthropydatacommons.org"
    interval: 600s
    conditions:
      - "[STATUS] == 200"
    alerts:
