storage:
  type: sqlite
  path: /data/data.db

alerting:
  custom:
    url: "https://chat.opentechstrategies.com/api/v1/messages"
    method: POST
    headers:
      Content-Type: "application/x-www-form-urlencoded"
      Authorization: "Basic ${ZULIP_BASIC_AUTH}"
    body: "type=stream&to=PDC&topic=monitoring&content=ALERT:%20[ENDPOINT_NAME]%20status%20changed.%20Check%20the%20status%20page."

endpoints:
  - name: pdc
    url: "https://philanthropydatacommons.org"
    interval: 600s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: zulip
        description: "Healthcheck failed for philanthropydatacommons.org"
        send-on-resolved: true    

  - name: pdcapi
    url: "https://api.philanthropydatacommons.org"
    interval: 600s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: zulip
        description: "Healthcheck failed for api.philanthropydatacommons.org"
        send-on-resolved: true      

