storage:
  type: sqlite
  path: /data/data.db

alerting:
  custom:
    url: "https://chat.opentechstrategies.com/api/v1/messages"
    method: POST
    headers:
      Content-Type: "application/x-www-form-urlencoded"
      Authorization: "Basic ${ZULIP_BASIC_AUTH}"
    body: "type=stream&to=PDC&topic=monitoring&content=ALERT:%20[ENDPOINT_NAME]%20status%20changed.%20Check%20the%20status%20page: https%3A//pdc-status-test.opentechstrategies.com/"

endpoints:
  - name: PDC main site
    group: frontend
    url: "https://philanthropydatacommons.org"
    interval: 600s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        description: "Healthcheck failed for philanthropydatacommons.org"
        send-on-resolved: true    

  - name: PDC App
    group: frontend
    url: "https://app.philanthropydatacommons.org"
    interval: 600s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        description: "Healthcheck failed for app.philanthropydatacommons.org"
        send-on-resolved: true          

  - name: PDC Exchange
    group: frontend
    url: "https://exchange.philanthropydatacommons.org"
    interval: 600s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        description: "Healthcheck failed for exchange.philanthropydatacommons.org"
        send-on-resolved: true

  - name: PDC Admin
    group: frontend
    url: "https://admin.philanthropydatacommons.org"
    interval: 600s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        description: "Healthcheck failed for admin.philanthropydatacommons.org"
        send-on-resolved: true    

  - name: PDC API
    group: infra
    url: "https://api.philanthropydatacommons.org"
    interval: 600s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        description: "Healthcheck failed for api.philanthropydatacommons.org"
        send-on-resolved: true      

  - name: PDC Keycloak
    group: infra
    url: "https://auth.philanthropydatacommons.org"
    interval: 600s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        description: "Healthcheck failed for auth.philanthropydatacommons.org"
        send-on-resolved: true   

  - name: PDC Keycloak test
    group: infra
    url: "https://auth.test.philanthropydatacommons.org"
    interval: 600s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        description: "Healthcheck failed for auth.test.philanthropydatacommons.org"
        send-on-resolved: true

  - name: PDC utilities server
    group: infra
    url: "icmp://pdc-utilities.opentechstrategies.com"
    interval: 600s
    conditions:
     - "[CONNECTED] == true"
    alerts:
      - type: custom
        description: "Healthcheck failed for pdc-utilties.opentechstrategies.com"
        send-on-resolved: true

ui:
  title: "PDC Status (test server)"
  header: "PDC Status (test server)"
  dashboard-heading: " "
  dashboard-subheading: "Live status of Philanthropy Data Commons services"
  dark-mode: false
  favicon:
    default: "https://philanthropydatacommons.org/wp-content/uploads/2025/11/cropped-PDC-icon-32x32.png"
    size16x16: "https://philanthropydatacommons.org/wp-content/uploads/2025/11/cropped-PDC-icon-32x32.png"
    size32x32: "https://philanthropydatacommons.org/wp-content/uploads/2025/11/cropped-PDC-icon-32x32.png"
  logo: https://philanthropydatacommons.org/wp-content/uploads/2025/11/cropped-PDC-icon-192x192.png
  link: "https://philanthropydatacommons.org"
  custom-css: |
    #global {
      background-color: #ffffff;
      color: #343434;
    }    
    #header h1 {
            color: #343434;
    }
    .endpoint, .endpoint-group {
      border: 3px solid #1475bb;
      color: #343434;
    }
    /* I used this to force the endpoints into a single column, but this makes it so you have to scroll
      to see them all at most zoom levels. 
        [class*="grid-cols-1"][class*="gap-3"] {
          grid-template-columns: 1fr !important;
    }*/
    .endpoint-header {
      padding: 0.3rem 0.5rem !important;
    }
    .endpoint-content {
      padding: 0.3rem 0.5rem !important;
    }
    .endpoint-header h3, .endpoint-header h3 span {
      color: #343434 !important;
    }
    /* This statement suppresses the  "Search Endpoints / Filter by / Sort by" bar. Comment out to bring it back. */
    .lg\:flex-row {
      display: none !important;
    }
    /* The following statements override the default green-for-healthy and red-for-unhealthy colors with PDC blue & orange. */
    [class*="bg-green-500"] {
      background-color: #1475bb !important;
    }
    [class*="bg-green-400"] {
      background-color: #ffffff !important;
    }
    [class*="hover:bg-green-700"]:hover {
      background-color: #1477bb !important;
    }
    [class*="bg-red-500"] {
      background-color: #f48320 !important;
    }
    [class*="bg-red-400"] {
      background-color: #f48320 !important;
    }
    [class*="hover:bg-red-700"]:hover {
      background-color: #c47320 !important;
    }